
[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mlflow-medical-registry"
version = "0.1.0"
requires-python = ">=3.11"

dependencies = [
    "fastapi",
    "uvicorn",
    "mlflow",
    "paddleocr",
    "paddlepaddle",
    "scikit-learn",
    "numpy",
    "pandas",
    "torch",
    "transformers",
    "sentence-transformers",
    "datasets",
    "peft",
    "accelerate",
    "msal",
    "python-dotenv"
]
